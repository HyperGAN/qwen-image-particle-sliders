[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-image-particle-sliders"
version = "0.2.0"
description = "Particle Sliders for Qwen-Image 2.1 using the shared HyperGAN core"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "QWEN-RESEARCH-LICENSE.txt"]
dependencies = [
  "particlegan==0.9.1",
  "torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=1.26", "pillow>=10", "safetensors>=0.8,<1",
  "transformers==5.17.0", "accelerate>=1,<2", "huggingface-hub>=1.32,<2",
  "diffusers @ git+https://github.com/huggingface/diffusers.git@1d5d056ecff3a8c1d887a7dd1aa66ca4a0323458",
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@4be0b5b29d2e2c741431f468d71ba8a7c884b724#subdirectory=packages/particle-sliders-core",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8", "build>=1"]
hndl = ["hndl==0.8.2; python_version < '3.15'"]

[project.scripts]
qwen-slider-train = "qwen_image_sliders.train:main"
qwen-slider-infer = "qwen_image_sliders.infer:main"
qwen-slider-preflight = "qwen_image_sliders.runtime:main"

[project.urls]
Repository = "https://github.com/HyperGAN/qwen-image-particle-sliders"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_image_sliders = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
