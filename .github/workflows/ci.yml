name: CPU native integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU runtime and exact source dependencies
        run: |
          python -m pip install 'torch==2.14.1' 'torchvision==0.29.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/qwen-gate" 'particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@b1f780decc516808cfd3019d5e5b674457161f86#subdirectory=packages/particle-sliders-core'
          printf 'QWEN_GATE_CORE_WHEEL=%s\n' "$RUNNER_TEMP/qwen-gate/particle_sliders_core-0.15.2-py3-none-any.whl" >> "$GITHUB_ENV"
      - name: Test actual tiny native API and unit contracts
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m pytest -q --ignore=tests/test_cached_scoped.py
          python scripts/check_cuda_resume.py --dummy --outdir outputs/resume-ci
          qwen-slider-train --dummy --steps 4 --gradient-checkpointing --outdir outputs/ci
          qwen-slider-infer --dummy --adapter outputs/ci/adapter.safetensors --prompt 'A ceramic cup.' --out outputs/ci/latents.pt
      - name: Build distributable with licenses
        run: python -m build
      - name: Verify installed wheel outside source checkout
        run: |
          python -m pip uninstall -y qwen-image-particle-sliders
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          qwen-slider-train --help
          qwen-slider-infer --help
          qwen-slider-preflight
          qwen-slider-train --dummy --steps 2 --outdir /tmp/qwen-wheel-smoke
          cp "$GITHUB_WORKSPACE/tests/test_scheduled_inference.py" "$RUNNER_TEMP/test_qwen_schedule_installed.py"
          python -I -m pytest -q "$RUNNER_TEMP/test_qwen_schedule_installed.py"
      - name: Test FOUR opt-in cases against the genuine installed wheel
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -I -B scripts/check_cached_scoped_installed.py --fixture "$GITHUB_WORKSPACE/tests/test_cached_scoped.py" --work "$RUNNER_TEMP/qwen-scoped-installed"
      - name: Retain installed-wheel opt-in software results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-scoped-installed-software-${{ matrix.python }}
          path: ${{ runner.temp }}/qwen-scoped-installed/reports
          if-no-files-found: ignore
