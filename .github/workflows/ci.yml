name: CPU native integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU runtime and exact source dependencies
        run: |
          python -m pip install 'torch==2.14.1' 'torchvision==0.29.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Test actual tiny native API and unit contracts
        run: |
          python -m ruff check src tests
          python -m pytest -q
          qwen-slider-train --dummy --steps 4 --gradient-checkpointing --outdir outputs/ci
          qwen-slider-infer --dummy --adapter outputs/ci/adapter.safetensors --prompt 'A ceramic cup.' --out outputs/ci/latents.pt
      - name: Build distributable with licenses
        run: python -m build
      - name: Verify installed wheel outside source checkout
        run: |
          python -m pip uninstall -y qwen-image-particle-sliders
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          qwen-slider-train --help
          qwen-slider-infer --help
          qwen-slider-preflight
          qwen-slider-train --dummy --steps 2 --outdir /tmp/qwen-wheel-smoke
