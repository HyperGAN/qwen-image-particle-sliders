[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-image-strict-native-candidate"
version = "0.1.5"
description = "Separate explicit CPU encoder / strict CUDA-BF16 DiT+VAE QwenImage21 source candidate"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
 "qwen-image-particle-sliders @ git+https://github.com/HyperGAN/qwen-image-particle-sliders.git@a0090e51a819adaae2890038767dd39c9a231928",
 "torch==2.9.1", "torchvision==0.24.1", "transformers==5.17.0", "accelerate==1.15.0",
 "safetensors==0.8.0", "Pillow==13.0.0", "numpy==2.5.4", "huggingface-hub==1.33.0",
 "tokenizers==0.23.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1"]

[project.entry-points."particle_sliders.image_backends"]
qwen-image-native-strict = "qwen_image_strict.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
qwen-image-native-strict = "qwen_image_strict.inference:BACKEND"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_image_strict = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
